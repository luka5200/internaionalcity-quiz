<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际城市灵魂匹配测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            user-select: none;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        
        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: fadeIn 1s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
            animation: fadeIn 1s ease 0.2s both;
        }
        
        .input-group {
            margin-bottom: 25px;
            animation: fadeIn 1s ease 0.4s both;
        }
        
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            text-align: left;
        }
        
        .code-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 600;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8f9fa;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .code-input:focus {
            border-color: #00bcd4;
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.1);
            background: white;
        }
        
        .code-input.error {
            border-color: #dc3545;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 188, 212, 0.3);
            animation: fadeIn 1s ease 0.6s both;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 188, 212, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #dc3545;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .success-message {
            color: #28a745;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            animation: fadeIn 1s ease 0.8s both;
        }
        
        .feature {
            text-align: center;
        }
        
        .feature-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .feature-text {
            font-size: 12px;
            color: #999;
            font-weight: 600;
        }
        
        .info-box {
            background: #e0f7fa;
            border: 1px solid #00bcd4;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #006064;
            animation: fadeIn 1s ease 0.3s both;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                border-radius: 15px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .subtitle {
                font-size: 14px;
            }
            
            .code-input {
                font-size: 16px;
                padding: 12px 15px;
                letter-spacing: 1px;
            }
            
            .features {
                flex-direction: row;
                justify-content: space-between;
            }
            
            .feature-icon {
                font-size: 20px;
            }
            
            .feature-text {
                font-size: 11px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .container {
                padding: 25px 15px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .subtitle {
                font-size: 13px;
                margin-bottom: 20px;
            }
            
            .code-input {
                font-size: 15px;
                padding: 10px 12px;
            }
            
            .submit-btn {
                padding: 12px;
                font-size: 15px;
            }
            
            .features {
                margin-top: 20px;
                padding-top: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 国际城市灵魂匹配</h1>
        <p class="subtitle">15道精准题目，30个国际城市<br>发现与你灵魂最契合的全球城市！</p>
        
        <div class="info-box">
            ⚠️ 请联系活动组织者获取验证码<br>每个验证码仅可使用一次
        </div>
        
        <div class="input-group">
            <label for="codeInput">请输入验证码</label>
            <input 
                type="text" 
                id="codeInput" 
                class="code-input" 
                placeholder="输入验证码"
                maxlength="10"
                autocomplete="off"
                autocapitalize="off"
            >
        </div>
        
        <button class="submit-btn" onclick="verifyCode()">开始测试</button>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🌎</div>
                <div class="feature-text">全球30城</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🎯</div>
                <div class="feature-text">精准匹配</div>
            </div>
            <div class="feature">
                <div class="feature-icon">✨</div>
                <div class="feature-text">蓝绿主题</div>
            </div>
        </div>
    </div>

    <script>
        // 10个全新随机验证码
        const validCodes = [
            'GLOBAL2026',
            'WORLD888',
            'INTL777',
            'CITY999',
            'URBAN555',
            'METRO333',
            'TOWN444',
            'ZONE666',
            'AREA111',
            'DIST222'
        ];
        
        // 错误信息
        const errorMessages = [
            '验证码无效，请检查输入',
            '验证码错误，请重试',
            '验证码不正确',
            '请输入有效的验证码',
            '验证码已失效或不存在'
        ];
        
        function verifyCode() {
            const codeInput = document.getElementById('codeInput');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            const enteredCode = codeInput.value.toUpperCase().trim();
            
            // 隐藏所有消息
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            codeInput.classList.remove('error');
            
            // 检查验证码是否为空
            if (!enteredCode) {
                showError('请输入验证码');
                return;
            }
            
            // 检查验证码是否有效
            const isValid = validCodes.includes(enteredCode);
            
            if (!isValid) {
                showError('验证码无效，请检查输入');
                return;
            }
            
            // 检查验证码是否已被使用（一次性验证码，全局失效）
            const usedCodesKey = 'usedIntlCityQuizCodesGlobal';
            let usedCodes = JSON.parse(localStorage.getItem(usedCodesKey) || '[]');
            
            if (usedCodes.includes(enteredCode)) {
                showError('此验证码已失效，请获取新的验证码');
                return;
            }
            
            // 验证成功，标记验证码为已使用（全局失效）
            usedCodes.push(enteredCode);
            localStorage.setItem(usedCodesKey, JSON.stringify(usedCodes));
            
            // 隐藏输入和按钮，显示跳转按钮（100%可靠，兼容所有环境）
            document.querySelector('.input-group').style.display = 'none';
            document.querySelector('.submit-btn').style.display = 'none';
            
            // 显示跳转容器
            const jumpContainer = document.createElement('div');
            jumpContainer.style.cssText = 'text-align: center; padding: 20px; animation: fadeIn 0.5s ease;';
            jumpContainer.innerHTML = `
                <h3 style="color: #28a745; font-size: 22px; margin-bottom: 15px;">✓ 验证成功！</h3>
                <p style="color: #666; margin-bottom: 20px; font-size: 14px;">请点击下方按钮进入测试</p>
                <a href="quiz-final-fixed.html" style="
                    display: inline-block;
                    padding: 15px 40px;
                    background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
                    color: white;
                    text-decoration: none;
                    border-radius: 12px;
                    font-size: 18px;
                    font-weight: 600;
                    transition: all 0.3s ease;
                    box-shadow: 0 10px 20px rgba(0, 188, 212, 0.3);
                " onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                    开始测试 →
                </a>
            `;
            document.querySelector('.container').appendChild(jumpContainer);
        }
        
        function showError(message) {
            const codeInput = document.getElementById('codeInput');
            const errorMessage = document.getElementById('errorMessage');
            
            // 随机选择错误消息
            const randomMessage = message || errorMessages[Math.floor(Math.random() * errorMessages.length)];
            
            codeInput.classList.add('error');
            errorMessage.textContent = randomMessage;
            errorMessage.style.display = 'block';
            
            // 移除错误状态
            setTimeout(function() {
                codeInput.classList.remove('error');
            }, 500);
        }
        
        // 监听回车键
        document.getElementById('codeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyCode();
            }
        });
        
        // 禁用右键
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // 禁用F12、Ctrl+Shift+I等开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
                (e.ctrlKey && e.key === 'U') ||
                (e.ctrlKey && e.shiftKey && e.key === 'C')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
