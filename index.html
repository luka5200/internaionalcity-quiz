<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际城市灵魂匹配测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; padding: 40px 30px; text-align: center; }
        h1 { font-size: 28px; background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 16px; }
        .code-input { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #e0e0e0; border-radius: 12px; text-align: center; margin-bottom: 20px; outline: none; }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: 600; }
        .error-message { color: #dc3545; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 国际城市灵魂匹配</h1>
        <p class="subtitle">发现与你灵魂最契合的全球城市！</p>
        <input type="text" id="codeInput" class="code-input" placeholder="请输入验证码">
        <button class="submit-btn" onclick="verifyCode()">立即验证并开始</button>
        <div class="error-message" id="errorMessage">验证码无效</div>
    </div>
    <script>
        const validCodes = ['GLOBAL2026', 'WORLD888', 'INTL777', 'CITY999', 'URBAN555'];
        function verifyCode() {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            if (validCodes.includes(code)) {
                localStorage.setItem('intlCityQuizVerified', 'true');
                window.location.href = 'quiz.html';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        }
    </script>
</body>
</html>
