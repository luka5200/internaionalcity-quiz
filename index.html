<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际城市灵魂匹配测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            user-select: none;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { font-size: 16px; color: #666; margin-bottom: 30px; line-height: 1.6; }
        .input-group { margin-bottom: 25px; }
        .code-input {
            width: 100%; padding: 15px 20px; font-size: 18px; font-weight: 600;
            border: 2px solid #e0e0e0; border-radius: 12px; outline: none;
            text-align: center; letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .code-input:focus { border-color: #00bcd4; background: white; }
        .submit-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(0, 188, 212, 0.3);
        }
        .submit-btn:hover { transform: translateY(-2px); }
        .error-message { color: #dc3545; font-size: 14px; font-weight: 600; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 国际城市灵魂匹配</h1>
        <p class="subtitle">15道精准题目，30个国际城市<br>发现与你灵魂最契合的全球城市！</p>
        
        <div class="input-group">
            <input type="text" id="codeInput" class="code-input" placeholder="输入验证码">
        </div>
        
        <button class="submit-btn" onclick="verifyCode()">开始测试</button>
        <div class="error-message" id="errorMessage">验证码无效</div>
    </div>

    <script>
        const validCodes = ['GLOBAL2026', 'WORLD888', 'INTL777', 'CITY999', 'URBAN555', 'METRO333', 'TOWN444', 'ZONE666', 'AREA111', 'DIST222'];
        
        function verifyCode() {
            const codeInput = document.getElementById('codeInput');
            const errorMessage = document.getElementById('errorMessage');
            const enteredCode = codeInput.value.toUpperCase().trim();
            
            if (validCodes.includes(enteredCode)) {
                // 1. 设置验证通过标记
                localStorage.setItem('intlCityQuizVerified', 'true');
                // 2. 直接跳转到 quiz.html (请确保 GitHub 文件名已改回 quiz.html)
                window.location.href = 'quiz.html';
            } else {
                errorMessage.style.display = 'block';
                codeInput.style.borderColor = '#dc3545';
            }
        }
        
        document.getElementById('codeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyCode();
        });
    </script>
</body>
</html>
