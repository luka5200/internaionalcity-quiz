<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际城市灵魂匹配测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            user-select: none;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { font-size: 16px; color: #666; margin-bottom: 30px; line-height: 1.6; }
        .input-group { margin-bottom: 25px; }
        .code-input {
            width: 100%; padding: 15px 20px; font-size: 18px; font-weight: 600;
            border: 2px solid #e0e0e0; border-radius: 12px; outline: none;
            text-align: center; letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .code-input:focus { border-color: #00bcd4; background: white; }
        .submit-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(0, 188, 212, 0.3);
        }
        .submit-btn:hover { transform: translateY(-2px); }
        .error-message { color: #dc3545; font-size: 14px; font-weight: 600; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 国际城市灵魂匹配</h1>
        <p class="subtitle">15道精准题目，30个国际城市<br>发现与你灵魂最契合的全球城市！</p>
        
        <div class="input-group">
            <input type="text" id="codeInput" class="code-input" placeholder="请输入验证码">
        </div>
        
        <button class="submit-btn" onclick="verifyCode()">开始测试</button>
        <div class="error-message" id="errorMessage">验证码无效</div>
    </div>

    <script>
        // 在这里添加你的验证码
        const validCodes = ['GLOBAL2026', 'WORLD888', 'INTL777', 'CITY999', 'URBAN555', 'METRO333', 'TOWN444', 'ZONE666', 'AREA111', 'DIST222'];
        
        function verifyCode() {
            const codeInput = document.getElementById('codeInput');
            const errorMessage = document.getElementById('errorMessage');
            const enteredCode = codeInput.value.toUpperCase().trim();
            
            // 1. 获取这个浏览器“已使用过”的验证码列表
            let usedCodes = JSON.parse(localStorage.getItem('used_quiz_codes') || '[]');

            // 2. 检查验证码是否为空
            if (!enteredCode) return;

            // 3. 检查：这个码是不是已经被用过了？
            if (usedCodes.includes(enteredCode)) {
                errorMessage.textContent = "该验证码已失效（此设备已使用过）";
                showError();
                return;
            }

            // 4. 检查：这个码是不是有效的码？
            if (validCodes.includes(enteredCode)) {
                // 验证通过！
                
                // A. 把这个码加入“已使用”名单，存入浏览器
                usedCodes.push(enteredCode);
                localStorage.setItem('used_quiz_codes', JSON.stringify(usedCodes));
                
                // B. 发放入场券
                localStorage.setItem('intlCityQuizVerified', 'true');
                
                // C. 跳转
                window.location.href = 'quiz.html';
            } else {
                // 验证码根本就不存在
                errorMessage.textContent = "验证码错误";
                showError();
            }
        }

        function showError() {
            const errorMessage = document.getElementById('errorMessage');
            const codeInput = document.getElementById('codeInput');
            errorMessage.style.display = 'block';
            codeInput.style.borderColor = '#dc3545';
            setTimeout(() => {
                codeInput.style.borderColor = '#e0e0e0';
            }, 2000);
        }
        
        document.getElementById('codeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyCode();
        });
    </script>
</body>
</html>
