        let currentIdx = 0;
        let userScores = { wealth: 0, chill: 0, global: 0, vibe: 0, nature: 0, safety: 0 };
        const dimensionMap = { '财富': 'wealth', '悠闲': 'chill', '全球': 'global', '活力': 'vibe', '自然': 'nature', '安全': 'safety' };

        function startQuiz() {
            // 【关键修复】这里不再检查 LocalStorage，直接开始
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            renderProgress();
            renderQuestion();
        }

        function renderProgress() {
            const container = document.getElementById('progress');
            container.innerHTML = '';
            for (let i = 0; i < config.totalQuestions; i++) {
                const dot = document.createElement('div');
                dot.className = `progress-dot ${i < currentIdx ? 'completed' : ''} ${i === currentIdx ? 'active' : ''}`;
                container.appendChild(dot);
            }
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question').textContent = `第 ${currentIdx + 1}/${config.totalQuestions} 题：${q.question}`;
            const container = document.getElementById('options');
            container.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt.text;
                div.onclick = () => selectOption(idx);
                container.appendChild(div);
            });
        }

        function selectOption(idx) {
            const q = questions[currentIdx];
            userScores[q.dimension] += q.options[idx].score;
            setTimeout(() => {
                currentIdx++;
                if (currentIdx < config.totalQuestions) {
                    renderProgress();
                    renderQuestion();
                } else {
                    showResult();
                }
            }, 300);
        }

        function calculateMatchScore(city, userScores) {
            // 找到用户得分最高的维度
            let userMaxDim = Object.keys(userScores).reduce((a, b) => userScores[a] > userScores[b] ? a : b);
            
            // 基础差异计算
            let totalDiff = 0;
            ['wealth', 'chill', 'global', 'vibe', 'nature', 'safety'].forEach(dim => {
                totalDiff += Math.abs((city[dim] || 0) - (userScores[dim] || 0));
            });
            
            let match = Math.max(0, 1 - totalDiff / 60);
            
            // 优势加成（修复了之前的变量引用错误）
            // 将英文维度转换为中文，以便匹配 city.strengths
            const dimNameMap = { 'wealth': '财富', 'chill': '悠闲', 'global': '全球', 'vibe': '活力', 'nature': '自然', 'safety': '安全' };
            if (city.strengths && city.strengths.includes(dimNameMap[userMaxDim])) {
                match += 0.1; 
            }
            
            // 随机因子
            return Math.round(Math.min(98, Math.max(40, match * 100 + Math.random() * 5)));
        }

        function showResult() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');

            // 计算所有城市匹配度
            const scoredCities = cities.map(city => ({
                ...city,
                score: calculateMatchScore(city, userScores)
            })).sort((a, b) => b.score - a.score);

            const best = scoredCities[0];

            // 填充数据
            document.getElementById('cityName').innerHTML = `${best.icon} ${best.name}`;
            document.getElementById('matchScore').textContent = `匹配度：${best.score}%`;
            document.getElementById('portrait').textContent = best.portrait;
            
            const tagsDiv = document.getElementById('tags');
            tagsDiv.innerHTML = best.tags.map(t => `<span class="tag">${t}</span>`).join('');

            // 绘制雷达图
            drawRadarChart(best, userScores);

            // 推荐列表
            const listDiv = document.getElementById('recommendedList');
            listDiv.innerHTML = '';
            scoredCities.slice(1, 4).forEach(c => {
                listDiv.innerHTML += `
                    <div class="recommended-item">
                        <div class="recommended-city-name">${c.icon} ${c.name}</div>
                        <div class="recommended-score">${c.score}%</div>
                    </div>
                `;
            });
        }

        function drawRadarChart(city, userScores) {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            ctx.scale(2, 2);
            
            const w = canvas.offsetWidth, h = canvas.offsetHeight;
            const centerX = w / 2, centerY = h / 2, radius = 80;
            const dims = [
                {key:'wealth', label:'财富'}, {key:'chill', label:'悠闲'},
                {key:'global', label:'全球'}, {key:'vibe', label:'活力'},
                {key:'nature', label:'自然'}, {key:'safety', label:'安全'}
            ];

            // 绘制背景
            ctx.strokeStyle = '#ddd';
            for(let i=1; i<=5; i++) {
                ctx.beginPath();
                dims.forEach((_, idx) => {
                    const angle = (Math.PI*2 * idx) / 6 - Math.PI/2;
                    const r = (radius/5)*i;
                    ctx[idx===0?'moveTo':'lineTo'](centerX + Math.cos(angle)*r, centerY + Math.sin(angle)*r);
                });
                ctx.closePath();
                ctx.stroke();
            }

            // 绘制数据函数
            function drawLayer(data, color, isUser) {
                ctx.beginPath();
                dims.forEach((d, idx) => {
                    const angle = (Math.PI*2 * idx) / 6 - Math.PI/2;
                    let val = isUser ? data[d.key] : data[d.key];
                    val = Math.max(2, Math.min(10, val)); // 限制范围
                    const r = (radius * val) / 10;
                    ctx[idx===0?'moveTo':'lineTo'](centerX + Math.cos(angle)*r, centerY + Math.sin(angle)*r);
                });
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = color.replace('0.4', '1');
                ctx.stroke();
            }

            drawLayer(city, 'rgba(0, 188, 212, 0.4)', false); // 城市
            drawLayer(userScores, 'rgba(76, 175, 80, 0.4)', true); // 用户

            // 文字
            ctx.fillStyle = '#666';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            dims.forEach((d, idx) => {
                const angle = (Math.PI*2 * idx) / 6 - Math.PI/2;
                ctx.fillText(d.label, centerX + Math.cos(angle)*(radius+20), centerY + Math.sin(angle)*(radius+20)+5);
            });
        }
    </script>
</body>
</html>
