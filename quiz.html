<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际城市灵魂匹配 - 最终版</title>
    <style>
        /* CSS 样式保持你满意的原版 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .quiz-container {
            background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px; width: 100%; padding: 40px; animation: fadeIn 0.5s ease-out;
            max-height: 95vh; overflow-y: auto;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .start-screen, .quiz-screen, .result-screen { display: none; text-align: center; }
        .active { display: block; }
        h1 { color: #2c3e50; margin-bottom: 20px; font-size: 32px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 30px; font-size: 18px; line-height: 1.6; }
        .start-btn, .restart-btn {
            background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%); color: white;
            border: none; padding: 18px 50px; font-size: 20px; border-radius: 30px;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(0,0,0,0.2); margin-top: 20px;
        }
        .start-btn:hover, .restart-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .restart-btn { background: #6c757d; }
        .progress { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; flex-wrap: wrap; }
        .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #e0e0e0; transition: all 0.3s ease; }
        .progress-dot.completed { background: #4caf50; }
        .progress-dot.active { background: #00bcd4; transform: scale(1.3); }
        .question { font-size: 22px; color: #2c3e50; margin-bottom: 30px; font-weight: 600; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f8f9fa; border: 2px solid #e9ecef; padding: 16px 20px;
            border-radius: 12px; cursor: pointer; transition: all 0.3s ease; font-size: 16px; text-align: left;
        }
        .option:hover { background: #e3f2fd; border-color: #00bcd4; transform: translateX(5px); }
        .result-screen h2 { font-size: 36px; color: #00bcd4; margin-bottom: 20px; }
        .match-score { font-size: 48px; font-weight: bold; color: #4caf50; margin: 20px 0; }
        .city-name { font-size: 28px; color: #2c3e50; margin-bottom: 15px; }
        .portrait { font-size: 16px; color: #7f8c8d; line-height: 1.8; margin-bottom: 20px; }
        .tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .tag { background: linear-gradient(135deg, #00bcd4 0%, #4caf50 100%); color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; }
        .radar-chart-container { width: 100%; max-width: 400px; margin: 30px auto; text-align: center; }
        #radarChart { max-width: 100%; height: auto; }
        .recommendation-section { background: #f8f9fa; border-radius: 15px; padding: 25px; margin-top: 30px; }
        .recommendation-title { font-size: 20px; color: #2c3e50; margin-bottom: 20px; font-weight: 600; }
        .recommended-cities { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .recommended-city { background: white; border: 2px solid #e9ecef; border-radius: 12px; padding: 15px; text-align: center; transition: all 0.3s ease; }
        .recommended-city:hover { border-color: #00bcd4; transform: translateY(-3px); }
        .recommended-city-icon { font-size: 32px; margin-bottom: 10px; }
        .recommended-city-name { font-size: 18px; font-weight: 600; color: #2c3e50; margin-bottom: 5px; }
        .recommended-city-score { font-size: 14px; color: #4caf50; font-weight: bold; }
        @media (max-width: 600px) { .quiz-container { padding: 25px; } h1 { font-size: 24px; } }
    </style>
</head>
<body>
    <div class="quiz-container">

            { question: "你对时尚和流行的关注度？", options: [ { text: "时尚达人，紧跟潮流", dimension: 1, score: 8 }, { text: "有一定关注，适度消费", dimension: 1, score: 6 }, { text: "实用为主，不太在意", dimension: 0, score: 5 }, { text: "喜欢复古、经典风格", dimension: 1, score: 7 } ] },
            { question: "你对语言和文化多样性的态度？", options: [ { text: "热爱学习新语言", dimension: 1, score: 8 }, { text: "愿意接触不同文化", dimension: 1, score: 6 }, { text: "母语为主，简单交流", dimension: 0, score: 5 }, { text: "通过旅行体验文化", dimension: 2, score: 7 } ] },
            { question: "你更看重城市的什么特质？", options: [ { text: "国际影响力，知名度", dimension: 0, score: 9 }, { text: "文化深度，历史积淀", dimension: 1, score: 9 }, { text: "自然环境，宜居程度", dimension: 2, score: 9 }, { text: "生活便利，性价比高", dimension: 3, score: 7 } ] }
        ];

        let userScores = [0, 0, 0, 0, 0, 0];
        let currentQuestionIndex = 0;
        const totalQuestions = questions.length;

        function startQuiz() {
            // 【修正】这里去掉了所有检查，直接开始，因为 index.html 已经拦过一道了
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            currentQuestionIndex = 0;
            userScores = [0, 0, 0, 0, 0, 0];
            renderProgress();
            renderQuestion();
        }

        function renderProgress() {
            const progressContainer = document.getElementById('progress');
            progressContainer.innerHTML = '';
            for (let i = 0; i < totalQuestions; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                if (i < currentQuestionIndex) dot.classList.add('completed');
                else if (i === currentQuestionIndex) dot.classList.add('active');
                progressContainer.appendChild(dot);
            }
        }

        function renderQuestion() {
            const question = questions[currentQuestionIndex];
            document.getElementById('question').textContent = `第 ${currentQuestionIndex + 1}/${totalQuestions} 题：${question.question}`;
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.textContent = option.text;
                optionElement.onclick = () => selectOption(index);
                optionsContainer.appendChild(optionElement);
            });
        }

        function selectOption(index) {
            const selectedOption = questions[currentQuestionIndex].options[index];
            userScores[selectedOption.dimension] += selectedOption.score;
            currentQuestionIndex++;
            if (currentQuestionIndex >= totalQuestions) showResult();
            else { renderProgress(); renderQuestion(); }
        }

        function showResult() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');

            let cityMatchScores = [];
            cities.forEach((city, index) => {
                let totalDiff = 0;
                for (let i = 0; i < 6; i++) {
                    const normalizedUserScore = userScores[i] / 20;
                    const normalizedCityScore = city.scores[i] / 10;
                    totalDiff += Math.pow(normalizedUserScore - normalizedCityScore, 2);
                }
                const matchScore = Math.round((1 - Math.sqrt(totalDiff / 6)) * 100);
                cityMatchScores.push({ index: index, name: city.name, icon: city.icon, score: Math.max(10, matchScore), city: city });
            });

            cityMatchScores.sort((a, b) => b.score - a.score);
            const bestMatch = cityMatchScores[0];

            document.getElementById('cityName').textContent = `${bestMatch.icon} ${bestMatch.name}`;
            document.getElementById('matchScore').textContent = `匹配度：${bestMatch.score}%`;
            document.getElementById('portrait').textContent = bestMatch.city.portrait;

            const tagsContainer = document.getElementById('tags');
            tagsContainer.innerHTML = '';
            bestMatch.city.tags.forEach(tag => {
                const tagElement = document.createElement('div');
                tagElement.className = 'tag';
                tagElement.textContent = tag;
                tagsContainer.appendChild(tagElement);
            });

            drawRadarChart(bestMatch.city);

            const recommendedList = document.getElementById('recommendedList');
            recommendedList.innerHTML = '';
            const recommendations = cityMatchScores.slice(1, 5);
            recommendations.forEach(rec => {
                const cityElement = document.createElement('div');
                cityElement.className = 'recommended-city';
                cityElement.innerHTML = `<div class="recommended-city-icon">${rec.icon}</div><div class="recommended-city-name">${rec.name}</div><div class="recommended-city-score">匹配度：${rec.score}%</div>`;
                recommendedList.appendChild(cityElement);
            });
        }

        function drawRadarChart(city) {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            canvas.width = 400; canvas.height = 400;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 150;
            const labels = ['事业', '文化', '自然', '平衡', '社交', '品质'];
            const dimensions = city.scores;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
            for (let level = 1; level <= 5; level++) {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                    const r = (radius / 5) * level;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath(); ctx.stroke();
            }

            ctx.strokeStyle = '#ccc';
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(x, y); ctx.stroke();
            }

            ctx.fillStyle = '#333'; ctx.font = '14px PingFang SC'; ctx.textAlign = 'center';
            const labelRadius = radius + 25;
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                const x = centerX + labelRadius * Math.cos(angle);
                const y = centerY + labelRadius * Math.sin(angle);
                ctx.fillText(labels[i], x, y);
            }

            ctx.beginPath();
            ctx.fillStyle = 'rgba(0, 188, 212, 0.3)'; ctx.strokeStyle = '#00bcd4'; ctx.lineWidth = 2;
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                const value = dimensions[i] / 10;
                const r = radius * value;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#00bcd4';
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                const value = dimensions[i] / 10;
                const r = radius * value;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
            }
        }

        function restartQuiz() {
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('startScreen').classList.add('active');
            userScores = [0, 0, 0, 0, 0, 0];
            currentQuestionIndex = 0;
        }
    </script>
</body>
</html>
